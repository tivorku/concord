syntax = "proto3";

option go_package = "./pb";
package message;

message NodeMessage {
  string type = 1;          
  string lot_id = 2;
  string peer_id = 3;
  int64  t = 4;
  int64  joined_at = 5;
  int64  last_epoch = 6;
  int64  last_top_tick = 7;
  bool   is_bot = 8;
  bytes  signature = 9;
  int64  active_ops = 10;
  int64  net_ops = 11;
}